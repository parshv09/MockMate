{% if messages %}
<div class="fixed top-24 right-4 z-[100] w-full max-w-sm space-y-4 px-4 pointer-events-none">
  {% for message in messages %}
  <div class="message-toast pointer-events-auto relative overflow-hidden glass-panel rounded-2xl border-l-4 shadow-2xl animate-slide-up 
    {% if message.tags == 'error' %}border-red-500 bg-white/80{% elif message.tags == 'warning' %}border-amber-500 bg-white/80{% elif message.tags == 'success' %}border-green-500 bg-white/80{% else %}border-primary-500 bg-white/80{% endif %}">
    
    <div class="p-4 flex items-start">
      <div class="flex-shrink-0 mr-3 mt-0.5">
        {% if message.tags == 'error' %}
          <div class="p-1.5 bg-red-100 text-red-600 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
        {% elif message.tags == 'warning' %}
          <div class="p-1.5 bg-amber-100 text-amber-600 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          </div>
        {% elif message.tags == 'success' %}
          <div class="p-1.5 bg-green-100 text-green-600 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          </div>
        {% else %}
          <div class="p-1.5 bg-primary-100 text-primary-600 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
        {% endif %}
      </div>

      <div class="flex-1 pt-0.5">
        <p class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1">
          {% if message.tags %}{{ message.tags }}{% else %}Notice{% endif %}
        </p>
        <p class="text-sm font-bold text-slate-700 leading-snug">{{ message }}</p>
      </div>

      <button onclick="closeMessage(this)" class="ml-4 text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="h-1 w-full bg-slate-100">
      <div class="h-full bg-slate-300/50 animate-progress-timer"></div>
    </div>
  </div>
  {% endfor %}
</div>

<style>
  @keyframes progress-timer {
    from { width: 100%; }
    to { width: 0%; }
  }
  .animate-progress-timer {
    animation: progress-timer 5000ms linear forwards;
  }
  .message-toast {
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>

<script>
  function closeMessage(btn) {
    const toast = btn.closest('.message-toast');
    toast.style.transform = 'translateX(100%)';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 500);
  }

  // Auto-hide messages after 5 seconds
  document.addEventListener('DOMContentLoaded', () => {
    const toasts = document.querySelectorAll('.message-toast');
    toasts.forEach(toast => {
      setTimeout(() => {
        if(toast) {
          toast.style.transform = 'translateX(100%)';
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 500);
        }
      }, 5000);
    });
  });
</script>
{% endif %}
